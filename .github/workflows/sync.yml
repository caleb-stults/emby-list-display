name: Sync Media Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

# Permissions required for both committing changes and publishing to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # STEP 1: Quality Gate
  test:
    runs-on: self-hosted
    env:
      EMBY_URL: ${{ secrets.EMBY_URL }}
      EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  # STEP 2: Sync Data, Commit, and Deploy Pages
  sync:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run Sync Container
        env:
          EMBY_URL: ${{ secrets.EMBY_URL }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest
          docker run --rm \
            --network host \
            -e EMBY_URL \
            -e EMBY_API_KEY \
            -v "$(pwd):/app:z" \
            ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add media.json and posters to bypass any hidden .gitignore rules
          git add -f docs/data/media.json
          git add -f docs/data/posters/
          
          # Print explicit git diff status for debugging
          echo "=== GIT STATUS OUTPUT ==="
          git status
          echo "========================="
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated Sync: Update media catalog $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "[WARNING] Git sees no changes in tracked or force-added files!"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

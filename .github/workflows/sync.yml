name: Sync Media Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    env:
      EMBY_URL: ${{ secrets.EMBY_URL }}
      EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  sync:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run Scraper (Native Node)
        env:
          EMBY_URL: ${{ secrets.EMBY_URL }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
        run: |
          npm install
          node fetch-media.js

      - name: Commit and Push Changes to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git commit -m "Automated Sync: Update media catalog $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes detected in docs/data/"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

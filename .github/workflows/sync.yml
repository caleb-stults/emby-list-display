name: Sync Media Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

# Grant the permissions required to deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # STEP 1: Quality Gate
  test:
    runs-on: self-hosted
    env:
      EMBY_URL: ${{ secrets.EMBY_URL }}
      EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  # STEP 2: Sync Data & Deploy Pages
  sync:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Sync Container
        env:
          EMBY_URL: ${{ secrets.EMBY_URL }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest
          docker run --rm \
            --network host \
            -e EMBY_URL \
            -e EMBY_API_KEY \
            -v "$(pwd)/docs/data:/app/docs/data:z" \
            ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest

      - name: Commit and Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff-index --quiet HEAD -- docs/data/; then
            git commit -m "Automated Sync: Update media catalog $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "No changes detected to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

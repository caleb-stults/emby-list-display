name: Sync Media Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

# Permissions required for both committing changes and publishing to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # STEP 1: Quality Gate
  test:
    runs-on: self-hosted
    env:
      EMBY_URL: ${{ secrets.EMBY_URL }}
      EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  # STEP 2: Sync Data, Commit, and Deploy Pages
  sync:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run Sync Container
        env:
          EMBY_URL: ${{ secrets.EMBY_URL }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest
          mkdir -p docs/data
          docker run --rm \
            --network host \
            -e EMBY_URL \
            -e EMBY_API_KEY \
            -e OUTPUT_DIR=/app/docs/data \
            -v "$(pwd)/docs/data:/app/docs/data:z" \
            ${{ secrets.DOCKERHUB_USERNAME }}/emby-list-fetcher:latest

      - name: Fix Local File Permissions & Debug Git
        run: |
          # Reclaim host ownership of any files generated by the Docker container
          sudo chown -R $(whoami):$(id -gn) docs/data/ || true
          # Print explicit status to runner logs
          echo "=== DIRECTORY CONTENTS ==="
          ls -la docs/data/
          echo "=== GIT STATUS ==="
          git status --porcelain docs/data/

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git commit -m "Automated Sync: Update media catalog $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "[WARNING] Git still sees no changes after permission fix."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
